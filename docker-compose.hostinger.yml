# ⚠️ DUMMY / VORLAGE — NICHT die Live-Konfiguration!
# Die echten Werte (inkl. API-Keys) stehen NUR im Hostinger-Docker-Manager-UI
# (https://hpanel.hostinger.com/vps/1400170/docker-manager, Projekt esg-regulierungs-check).
# Diese Datei dient nur als strukturelle Referenz. Stand: 2026-06-10 (= Live-Setup,
# Keys durch Platzhalter ersetzt).
services:
  web:
    image: ghcr.io/textil-mode/esg-regulierungs-check:latest
    container_name: esg-regulierungs-check
    ports:
      - "8082:8080"
    environment:
      # Optional: ohne diesen Wert erzeugt die App einmalig data/flask_secret
      # im Volume esg-data (ueberlebt Neustarts). Nie einen echten Key einchecken.
      - FLASK_SECRET=<im-hostinger-ui-gesetzt>
      - LLM_PROVIDER=google
      - OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - OPENAI_API_KEY=<google-ai-studio-key-im-hostinger-ui>
      - OPENAI_MODEL=gemini-3.1-flash-lite
      - LLM_CONCURRENCY=8
      - LLM_RPM=150
      - FULLTEXT_MAX_CHARS=25000
      # Mailversand des Passwort-Reset-Links ueber das Hostinger-Postfach
      # noreply@ki-textil-mode.de (SMTP, Port 587 mit STARTTLS). Fehlt einer
      # der vier Pflichtwerte, faellt die Anwendung auf den Admin-Weg
      # (/admin/passwort-resets) zurueck.
      - SMTP_HOST=<im-hostinger-ui-gesetzt>
      - SMTP_PORT=587
      - SMTP_USER=<im-hostinger-ui-gesetzt>
      - SMTP_PASSWORD=<im-hostinger-ui-gesetzt>
      - MAIL_FROM=<im-hostinger-ui-gesetzt>
      - MAIL_FROM_NAME=ESG-Regulierungs-Check
      # Feste Adresse dieser Instanz (Schema + Host, ohne Pfad). Der Reset-Link
      # wird daraus gebaut, nicht aus dem Host-Kopf der Anfrage — sonst laesst
      # er sich auf einen fremden Server umbiegen. Ohne diesen Wert verschickt
      # die App keine Reset-Mail. Je Container eigener Wert!
      - PUBLIC_BASE_URL=https://schuckert.cloud
      # Cache-Groesse je Gesetzestext. Muss deutlich groesser sein als
      # FULLTEXT_MAX_CHARS, weil lawparse.py den Anwendungsbereich erst aus
      # dem vollstaendigen Text auswaehlt. Default im Code: 400000.
      - LAW_TEXT_MAX_CHARS=400000
    volumes:
      - esg-data:/app/data
    restart: unless-stopped

volumes:
  esg-data:
