# ⚠️ DUMMY / VORLAGE — NICHT die Live-Konfiguration!
# Die echten Werte (inkl. API-Keys) stehen NUR im Hostinger-Docker-Manager-UI
# (https://hpanel.hostinger.com/vps/1400170/docker-manager, Projekt esg-regulierungs-check).
# Diese Datei dient nur als strukturelle Referenz. Stand: 2026-06-10 (= Live-Setup,
# Keys durch Platzhalter ersetzt).
services:
  web:
    image: ghcr.io/textil-mode/esg-regulierungs-check:latest
    container_name: esg-regulierungs-check
    ports:
      - "8082:8080"
    environment:
      - FLASK_SECRET=<im-hostinger-ui-gesetzt>
      - LLM_PROVIDER=google
      - OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - OPENAI_API_KEY=<google-ai-studio-key-im-hostinger-ui>
      - OPENAI_MODEL=gemini-2.5-flash-lite
      - LLM_CONCURRENCY=8
      - LLM_RPM=150
      - FULLTEXT_MAX_CHARS=25000
    volumes:
      - esg-data:/app/data
    restart: unless-stopped

volumes:
  esg-data:
