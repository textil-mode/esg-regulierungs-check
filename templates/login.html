{% extends "base.html" %}
{% block content %}

<div class="tabs">
  <button class="tab active" onclick="switchTab('login')">{{ t("tab_login", lang) }}</button>
  <button class="tab" onclick="switchTab('signup')">{{ t("tab_signup", lang) }}</button>
</div>

<!-- Login -->
<div id="tab-login" class="tab-content active">
  <div class="section" style="max-width:440px;">
    <form method="post" autocomplete="off">
      <input type="hidden" name="action" value="login">
      <label>{{ t("email", lang) }}</label>
      <input type="email" name="email" required autocomplete="new-email" placeholder=" ">
      <label>{{ t("password", lang) }}</label>
      <input type="password" name="password" required autocomplete="new-password" placeholder=" ">
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">{{ t("btn_login", lang) }}</button>
    </form>
    <p style="margin:12px 0 0;font-size:13px;">
      <button type="button" class="linklike" onclick="switchTab('forgot')">{{ t("link_forgot", lang) }}</button>
    </p>
  </div>
</div>

<!-- Passwort vergessen -->
<div id="tab-forgot" class="tab-content">
  <div class="section" style="max-width:440px;">
    <h3 style="margin-top:0;">{{ t("forgot_title", lang) }}</h3>
    <p style="font-size:13px;color:#5A5A5A;">{{ t("forgot_hint", lang) }}</p>
    <form method="post" autocomplete="off">
      <input type="hidden" name="action" value="forgot">
      <label>{{ t("email", lang) }}</label>
      <input type="email" name="email" required autocomplete="new-email" placeholder=" ">
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">{{ t("btn_forgot", lang) }}</button>
    </form>
    <p style="margin:12px 0 0;font-size:13px;">
      <button type="button" class="linklike" onclick="switchTab('login')">{{ t("back_to_login", lang) }}</button>
    </p>
  </div>
</div>

<!-- Signup -->
<div id="tab-signup" class="tab-content">
  <div class="section" style="max-width:440px;">
    <form method="post" autocomplete="off">
      <input type="hidden" name="action" value="signup">
      <label>{{ t("email", lang) }}</label>
      <input type="email" name="email" required autocomplete="new-email" placeholder=" ">
      <label>{{ t("password_min", lang) }}</label>
      <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder=" ">
      <label>{{ t("password_repeat", lang) }}</label>
      <input type="password" name="password2" required minlength="8" autocomplete="new-password" placeholder=" ">
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">{{ t("btn_signup", lang) }}</button>
    </form>
  </div>
</div>

<script>
function switchTab(name) {
  // "forgot" ist kein eigener Reiter — der Login-Reiter bleibt dann aktiv.
  const tabIndex = (name === 'signup') ? 1 : 0;
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', i === tabIndex));
  ['login','signup','forgot'].forEach(n =>
    document.getElementById('tab-' + n).classList.toggle('active', n === name));
}
// Browser-Autofill leeren
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('input[type="email"], input[type="password"]').forEach(el => { el.value = ''; });
  }, 100);
});
</script>
{% endblock %}
