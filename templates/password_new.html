{% extends "base.html" %}
{% block content %}

<div class="section" style="max-width:440px;">
  <h2 style="margin-top:0;">{{ t("pw_code_title", lang) }}</h2>
  <p style="font-size:13px;color:#5A5A5A;">{{ t("pw_code_hint", lang) }}</p>

  <form method="post" autocomplete="off">
    <label>{{ t("email", lang) }}</label>
    <input type="email" name="email" required value="{{ email }}"
           autocomplete="username" placeholder=" ">

    <label>{{ t("field_code", lang) }}</label>
    <input type="text" name="code" required inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="one-time-code" placeholder=" "
           style="font-family:monospace;font-size:20px;letter-spacing:4px;">

    <label>{{ t("password_min", lang) }}</label>
    <input type="password" name="password" required minlength="8"
           autocomplete="new-password" placeholder=" ">

    <label>{{ t("password_repeat", lang) }}</label>
    <input type="password" name="password2" required minlength="8"
           autocomplete="new-password" placeholder=" ">

    <button type="submit" class="btn btn-primary"
            style="width:100%;margin-top:6px;">{{ t("btn_pw_save", lang) }}</button>
  </form>

  <p style="margin-bottom:0;margin-top:14px;font-size:13px;">
    <a href="{{ url_for('login') }}">{{ t("back_to_login", lang) }}</a>
  </p>
</div>

{% endblock %}
