{% extends "base.html" %}
{% block content %}

<div class="section" style="max-width:440px;">
  <h2 style="margin-top:0;">{{ t("pw_change_title", lang) }}</h2>
  <form method="post" autocomplete="off">
    <label>{{ t("pw_current", lang) }}</label>
    <input type="password" name="current_password" required autocomplete="new-password" placeholder=" ">
    <label>{{ t("password_min", lang) }}</label>
    <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder=" ">
    <label>{{ t("password_repeat", lang) }}</label>
    <input type="password" name="password2" required minlength="8" autocomplete="new-password" placeholder=" ">
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">{{ t("btn_pw_save", lang) }}</button>
  </form>
  <p style="margin-bottom:0;">
    <a href="{{ url_for('dashboard') }}">{{ t("back_to_dashboard", lang) }}</a>
  </p>
</div>

{% endblock %}
